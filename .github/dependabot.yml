version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: quarterly
    open-pull-requests-limit: 10
    labels:
      - Dependencies
    groups:
      github-actions:
        patterns:
          - '*'
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: quarterly
    open-pull-requests-limit: 15
    labels:
      - Dependencies
      - JavaScript
    groups:
      wp-packages:
        patterns:
          - '@wordpress/*'
        exclude-patterns:
          - '@wordpress/element'
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint-community/*'
        exclude-patterns:
          - 'eslint-plugin-oxlint'
      babel:
        patterns:
          - 'babel-*'
          - '@babel/*'
        exclude-patterns:
          - 'babel-plugin-react-compiler'
      oxlint:
        patterns:
          - 'oxlint'
          - 'eslint-plugin-oxlint'
      react-compiler:
        patterns:
          - '*-react-compiler'
          - 'react-compiler-*'
      stylelint:
        patterns:
          - 'stylelint'
          - 'stylelint-*'
          - '@stylelint/*'
          - 'postcss-*'
          - 'cssnano'
      prettier:
        patterns:
          - 'prettier'
          - '@prettier/*'
      webpack:
        patterns:
          - 'webpack*'
          - '*-webpack-plugin'
          - '@pmmmwh/react-refresh-webpack-plugin'
          - 'mini-css-extract-plugin'
          - 'circular-dependency-plugin'
          - '*-loader'
          - '@jsdevtools/coverage-istanbul-loader'
          - '@svgr/webpack'
        exclude-patterns:
          - 'babel-loader'
          - 'karma-sourcemap-loader'
          - 'rollup-plugin-web-worker-loader'
      rollup:
        patterns:
          - 'rollup'
          - 'rollup-*'
          - '@rollup/*'
          - '@svgr/rollup'
      jest:
        patterns:
          - 'jest'
          - 'jest-*'
          - '@jest/*'
          - 'expect-puppeteer'
      testing-library:
        patterns:
          - '@testing-library/*'
      karma:
        patterns:
          - 'karma'
          - 'karma-*'
      puppeteer:
        patterns:
          - 'puppeteer'
          - '@percy/puppeteer'
      types:
        patterns:
          - '@types/*'
      development-dependencies:
        dependency-type: development
        update-types:
          - 'minor'
          - 'patch'
      production-dependencies:
        dependency-type: production
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - '@wordpress/element'
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      # styled-components is not yet compatible.
      - dependency-name: 'stylis-plugin-rtl'
        versions:
          - '>= 2'

      # Not all plugins are compatible yet
      - dependency-name: 'rollup'
        versions:
          - '>= 3'

      # We have not yet upgraded to React 18.
      - dependency-name: 'react'
        versions:
          - '>= 18'
      - dependency-name: 'react-dom'
        versions:
          - '>= 18'
      - dependency-name: '@testing-library/react'
        versions:
          - '>= 13'

      # ESM only
      - dependency-name: 'use-context-selector'
        versions:
          - '>= 2'
      - dependency-name: 'flagged'
        versions:
          - '>= 3'
      - dependency-name: 'mime'
        versions:
          - '>= 4'

      # Needs manual update
      - dependency-name: 'styled-components'
        versions:
          - '>= 6'

      # Needs manual update
      - dependency-name: 'eslint'
        versions:
          - '>= 9'
    cooldown:
      default-days: 7

  - package-ecosystem: composer
    directory: '/'
    schedule:
      interval: quarterly
    open-pull-requests-limit: 10
    labels:
      - Dependencies
      - PHP
    groups:
      phpstan:
        patterns:
          - 'phpstan/*'
          - 'swissspidy/phpstan-no-private'
          - 'szepeviktor/phpstan-wordpress'
          - 'php-stubs/*'
      phpcs:
        patterns:
          - 'automattic/vipwpcs'
          - 'dealerdirect/phpcodesniffer-composer-installer'
          - 'phpcompatibility/*'
          - 'sirbrillig/phpcs-variable-analysis'
          - 'slevomat/coding-standard'
          - 'squizlabs/php_codesniffer'
          - 'wp-coding-standards/wpcs'
      php-scoper:
        patterns:
          - 'humbug/php-scoper'
          - 'sniccowp/php-scoper-wordpress-excludes'
      development-dependencies:
        dependency-type: development
        update-types:
          - 'minor'
          - 'patch'
      production-dependencies:
        dependency-type: production
        update-types:
          - 'minor'
          - 'patch'
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
    cooldown:
      default-days: 7
